name: CI

on:
  push:
    branches: [master, beta]
  pull_request:
    types: [assigned, opened, synchronize, reopened]

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: install dependencies
        run: yarn install --immutable
      - name: lint
        run: yarn lint

  test:
    name: Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: install dependencies
        run: yarn install --immutable
      - name: test
        run: yarn test

  release:
    name: Building and releasing project
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    permissions:
      contents: write # push release commits, tags, create GitHub Releases
      issues: write # @semantic-release/github comments on resolved issues
      pull-requests: write # @semantic-release/github comments on merged PRs
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: install dependencies
        run: yarn install --immutable
      - name: build
        run: |
          yarn build:ts
          cp package.json dist/package.json
          cp README.md dist/README.md
          cp yarn.lock dist/yarn.lock
          cp -R node_modules dist/node_modules
          cp .releaserc.js dist/.releaserc.js
      - name: release
        env:
          GITHUB_TOKEN: ${{ secrets.ASSOCIATION_RELEASE_TOKEN }}
        run: |
          cd dist
          yarn --frozen-lockfile
          yarn semantic-release
